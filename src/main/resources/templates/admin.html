<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Administración | RegistroSeguro</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Registro<span>Seguro</span></a>
    <form th:action="@{/logout}" method="post" class="inline-form">
        <button class="button button-small button-secondary" type="submit">Cerrar sesión</button>
    </form>
</header>

<main class="page-shell page-shell-narrow">
    <section class="success-card">
        <p class="eyebrow">Área de administrador</p>
        <h1>Administración</h1>
        <p class="muted">Esta sección solo está disponible para cuentas con el rol ADMIN.</p>
        <a class="button" th:href="@{/users}">Ver usuarios registrados</a>
    </section>
</main>

<footer class="site-footer">Aplicación de registro y autenticación · Spring Boot</footer>
</body>
</html>
