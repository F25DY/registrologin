<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Crear cuenta | RegistroSeguro</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Registro<span>Seguro</span></a>
    <nav class="site-nav" aria-label="Navegación principal">
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/login}">Iniciar sesión</a>
    </nav>
</header>

<main class="page-shell page-shell-narrow">
    <section class="form-card">
        <p class="eyebrow">Únete a RegistroSeguro</p>
        <h1>Crear una cuenta</h1>
        <p class="muted">Ingresa tus datos para registrarte.</p>

        <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-success" role="status" th:if="${message}" th:text="${message}"></div>

        <form th:action="@{/process_register}" th:object="${user}" method="post" class="form-stack">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Nombre</label>
                    <input id="firstName" type="text" th:field="*{firstName}"
                           autocomplete="given-name" maxlength="50" required>
                    <span class="field-error" th:if="${#fields.hasErrors('firstName')}"
                          th:errors="*{firstName}"></span>
                </div>
                <div class="form-group">
                    <label for="lastName">Apellido</label>
                    <input id="lastName" type="text" th:field="*{lastName}"
                           autocomplete="family-name" maxlength="50" required>
                    <span class="field-error" th:if="${#fields.hasErrors('lastName')}"
                          th:errors="*{lastName}"></span>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" th:field="*{email}"
                       autocomplete="email" maxlength="100" required>
                <span class="field-error" th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" th:field="*{password}"
                       autocomplete="new-password" maxlength="100" required>
                <span class="field-hint">La contraseña se protegerá antes de guardarse.</span>
                <span class="field-error" th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"></span>
            </div>
            <button class="button button-full" type="submit">Crear cuenta</button>
        </form>

        <p class="form-footnote">¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </section>
</main>

<footer class="site-footer">Aplicación de registro y autenticación · Spring Boot</footer>
</body>
</html>
